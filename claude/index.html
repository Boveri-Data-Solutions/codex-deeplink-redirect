<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Opening Claude…</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #000; color: #f5f5f5; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem; text-align: center; }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; font-weight: 600; letter-spacing: -.03em; }
    p { margin: 0 0 1.75rem; color: #999; line-height: 1.6; }
    a { display: inline-block; padding: 1rem 2.5rem; border: 1px solid #383838; border-radius: .875rem; background: #1c1c1c; color: #fff; font-size: 1rem; font-weight: 600; text-decoration: none; }
    a:hover { background: #292929; border-color: #555; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Opening Claude…</h1>
    <p>If it doesn’t open automatically, click below.</p>
    <a id="fallback" href="#">Open Claude</a>
  </main>
  <script>
    // Claude desktop app session IDs look like local_<id> and open with code/continue.
    // Claude Code CLI session IDs are UUIDs and open with resume, which imports the session into the app.
    const DESKTOP_SESSION = /^local_[A-Za-z0-9-]{1,64}$/;
    const CLI_SESSION = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
    const id = (new URLSearchParams(location.search).get("id") || "").trim();
    let target = null;
    if (DESKTOP_SESSION.test(id)) {
      target = "claude://code/continue?session=" + encodeURIComponent(id) + "&source=notion";
    } else if (CLI_SESSION.test(id)) {
      target = "claude://resume?session=" + encodeURIComponent(id);
    }
    if (target) {
      document.getElementById("fallback").href = target;
      location.replace(target);
    } else {
      document.querySelector("main").innerHTML = id
        ? "<h1>Unrecognized session</h1><p>Expected a Claude session ID like <code>local_…</code> or a UUID.</p>"
        : "<h1>No session specified</h1><p>Missing <code>?id=</code> query parameter.</p>";
    }
  </script>
</body>
</html>
