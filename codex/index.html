<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Opening Codex…</title>
</head>
<body style="font-family: system-ui; padding: 2rem;">
  <p>Opening Codex…</p>
  <p>If nothing happens, <a id="fallback" href="#">click here</a>.</p>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    if (id) {
      const target = "codex://threads/" + id;
      document.getElementById("fallback").href = target;
      location.replace(target);
    } else {
      document.body.innerHTML = "<p>Missing <code>?id=</code> query parameter.</p>";
    }
  </script>
</body>
</html>
